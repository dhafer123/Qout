# Alembic configuration. Run from backend/:  uv run alembic upgrade head
# The database URL is NOT set here: env.py reads DATABASE_URL via app settings
# (environment variables / .env), so no credentials live in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC
# e.g. 20261111_1405_3f2a9c1b7d4e_add_products.py (sorts chronologically)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# New revision files are fixed and formatted with ruff (run as `python -m ruff`).
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
